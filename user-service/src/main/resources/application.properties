spring.application.name=user-service
spring.profiles.active=dev
server.port=8081
server.forward-headers-strategy=native
server.error.include-stacktrace=ALWAYS

# A mail server problem should not mark the whole service as down
management.health.mail.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# Address users open in the browser, used in email links
app.public-url=${PUBLIC_URL:http://localhost:8080}

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**,/auth/**

app.email.gif-url=https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2VxdjhtZmJveTRlcHprbTcydTZ3YmQ0c3VyOThocHN4dGZ6N2hvZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/jfKiMjWolBzuWkdbw0/giphy.gif

# Kafka: events are sent as JSON without Java type headers, so other services read them into their own classes
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
