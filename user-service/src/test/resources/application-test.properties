spring.datasource.url=jdbc:h2:mem:users;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# test only secret
jwt-secret=Ym9va25lc3QtdGVzdC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWNoYXJz

# emails are built but never sent (see CucumberSpringConfig)
spring.mail.host=localhost
spring.mail.username=test
spring.mail.domain=@test.com

# the tests do not need Kafka: nothing listens here, so events fail fast and are only logged
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=100
spring.kafka.admin.auto-create=false

# the scenarios log in many times in a row
app.auth-rate-limit=10000

# there is no Kafka in the tests, so the "could not publish" messages are only noise here
logging.level.org.springframework.kafka.support.LoggingProducerListener=OFF
logging.level.org.apache.kafka.clients.NetworkClient=OFF
