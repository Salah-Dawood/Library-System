spring.datasource.url=jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# test only secret, the same one the other services' tests use
jwt-secret=Ym9va25lc3QtdGVzdC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWNoYXJz

# emails are built as usual but kept in the test (see CucumberSpringConfig); nothing is really sent
spring.mail.host=localhost
spring.mail.username=booknest
spring.mail.domain=@example.com

# the Kafka address is set by the embedded broker the tests start

# live-notification streams stay open until they time out, so a graceful shutdown would wait 30 s for them
server.shutdown=immediate
