spring.application.name=api-gateway
server.port=8080

# Send the caller's IP on (X-Forwarded-For) so per-IP limits behind the gateway still work
spring.cloud.gateway.server.webmvc.trusted-proxies=.*

# Service addresses, overridable with environment variables (Docker sets them)
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8082}
lending-service.url=${LENDING_SERVICE_URL:http://localhost:8083}
notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}
frontend.url=${FRONTEND_URL:http://localhost:8083}

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${user-service.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/users/**,/auth/email/**,/api/member/**,/api/librarian/**,/profile/**

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${catalog-service.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/books/**,/api/authors/**,/api/genres/**,/api/reviews/**

spring.cloud.gateway.server.webmvc.routes[2].id=lending-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${lending-service.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/loans/**,/api/fines/**,/api/waitlist/**,/api/demo/**,/api/inventory/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${notification-service.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**,/api/audit-log/**

# Everything else is the frontend, served by lending-service until it gets its own service
spring.cloud.gateway.server.webmvc.routes[4].id=frontend
spring.cloud.gateway.server.webmvc.routes[4].uri=${frontend.url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/**
spring.cloud.gateway.server.webmvc.routes[4].order=1000
