spring.application.name=catalog-service
server.port=8082
server.forward-headers-strategy=native
server.error.include-stacktrace=ALWAYS

# Shares the monolith's database until the monolith is removed
spring.datasource.url=${DEMO_DATABASE}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt-secret=${JWT_SECRET}

# Copy counts and loans live in the lending service (the monolith for now)
lending-service.url=${LENDING_SERVICE_URL:http://localhost:9091}

springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**
