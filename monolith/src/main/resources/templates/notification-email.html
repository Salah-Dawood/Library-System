<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BookNest</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f9f9f9;">
<div style="max-width: 550px; margin: 40px auto; padding: 30px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #ffffff;">

    <h2 style="color: #2c3e50; margin-top: 0; text-align: center;" th:text="${subject}">BookNest</h2>

    <p style="text-align: center;">
        <img th:src="${Gif}" alt="" width="90" style="border-radius: 6px;" />
    </p>

    <p style="color: #34495e; font-size: 16px; line-height: 1.5; text-align: center;" th:text="${message}">Message</p>

    <p style="color: #95a5a6; font-size: 12px; margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; text-align: center;">You get this email because of activity on your BookNest account.</p>
</div>
</body>
</html>
