spring.profiles.active=demo,race-demo
spring.application.name=booknest

server.port=9091
server.forward-headers-strategy=native
server.error.include-stacktrace=ALWAYS
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**,/auth/**

# Email Template Asset URLs
app.email.gif-url=https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2VxdjhtZmJveTRlcHprbTcydTZ3YmQ0c3VyOThocHN4dGZ6N2hvZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/jfKiMjWolBzuWkdbw0/giphy.gif

app.fines.late-per-day=0.35

app.holds.hours=24

app.reminders.cron=0 0 9 * * *