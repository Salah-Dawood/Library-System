# BookNest on the AWS server (EC2). The database is RDS, the images come from Docker Hub.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Settings come from the .env file on the server (see .env.prod.example); VERSION picks the image tag.

# every container sends its logs to CloudWatch Logs (group /booknest/prod, one stream per container,
# for example booknest-lending-service-1); the server's IAM role allows the writing.
# non-blocking: if CloudWatch cannot be reached, logs wait in a small buffer instead of freezing the service.
x-logging: &cloudwatch
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:-us-east-1}
      awslogs-group: /booknest/prod
      tag: "{{.Name}}"
      mode: non-blocking
      max-buffer-size: 4m

# the settings every Spring Boot service shares
x-spring: &spring
  <<: *cloudwatch
  restart: unless-stopped
  mem_limit: 512m
  environment: &spring-env
    SPRING_PROFILES_ACTIVE: prod
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    DB_URL: jdbc:postgresql://${DB_HOST}:5432/booknest
    DB_PASSWORD: ${DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:

  kafka:
    <<: *cloudwatch
    image: apache/kafka:4.1.0
    restart: unless-stopped
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  user-service:
    <<: *spring
    image: ${DOCKERHUB_USER:-sala76}/booknest-user-service:${VERSION:-latest}
    environment:
      <<: *spring-env
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - profile-images:/app/profile
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck: &service-health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT:-8081}/actuator/health > /dev/null"]
      interval: 10s
      start_period: 60s
      retries: 12

  catalog-service:
    <<: *spring
    image: ${DOCKERHUB_USER:-sala76}/booknest-catalog-service:${VERSION:-latest}
    environment:
      <<: *spring-env
      LENDING_SERVICE_URL: http://lending-lb
      SERVER_PORT: 8082
    healthcheck: *service-health

  # two copies of lending-service share the database and Kafka; lending-lb splits the requests between them.
  # the borrowing rules lock rows in the database, so both copies stay consistent;
  # ShedLock makes sure only one copy runs each scheduled job.
  lending-service:
    <<: *spring
    deploy:
      replicas: 2
    image: ${DOCKERHUB_USER:-sala76}/booknest-lending-service:${VERSION:-latest}
    environment:
      <<: *spring-env
      # the race demo stays on so the concurrency rules can be shown on the live server
      SPRING_PROFILES_ACTIVE: prod,race-demo
      SERVER_PORT: 8083
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck: *service-health

  # the load balancer of lending-service: each request goes to the next copy in turn.
  # the X-Lending-Instance reply header and the log line show which copy answered.
  lending-lb:
    <<: *cloudwatch
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 64m
    configs:
      - source: lending-lb
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      lending-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost is IPv6 first, and nginx listens on IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/lb-health"]
      interval: 10s
      retries: 6

  notification-service:
    <<: *spring
    image: ${DOCKERHUB_USER:-sala76}/booknest-notification-service:${VERSION:-latest}
    environment:
      <<: *spring-env
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      SERVER_PORT: 8084
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck: *service-health

  frontend:
    <<: *cloudwatch
    image: ${DOCKERHUB_USER:-sala76}/booknest-frontend:${VERSION:-latest}
    restart: unless-stopped
    mem_limit: 64m

  api-gateway:
    <<: *cloudwatch
    image: ${DOCKERHUB_USER:-sala76}/booknest-api-gateway:${VERSION:-latest}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      LENDING_SERVICE_URL: http://lending-lb
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      FRONTEND_URL: http://frontend:80
    ports:
      - "80:8080"   # the site is on the normal web port of the server
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      lending-lb:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      frontend:
        condition: service_started

  # a web page to look inside the RDS database, next to the services (RDS itself stays private).
  # Off by default, so deploys never start it:
  #   start: docker compose -f docker-compose.prod.yml --profile admin up -d pgadmin
  #   stop:  docker compose -f docker-compose.prod.yml --profile admin stop pgadmin
  # Open http://<server-ip>:5050; the server's security group lets only your IP in on 5050.
  pgadmin:
    <<: *cloudwatch
    image: dpage/pgadmin4:9
    profiles: ["admin"]
    restart: "no"
    mem_limit: 384m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # the BookNest RDS database is already in the list
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  kafka-data:
  profile-images:
  pgadmin-data:

configs:
  # the RDS database in pgAdmin's list (DB_HOST comes from the server's .env); the password is asked on connect
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "BookNest RDS (AWS)",
            "Group": "Servers",
            "Host": "${DB_HOST}",
            "Port": 5432,
            "MaintenanceDB": "booknest",
            "Username": "postgres",
            "SSLMode": "require"
          }
        }
      }

  # nginx settings of lending-lb ($$ is a single $ for nginx; compose would read $ as one of its own variables)
  lending-lb:
    content: |
      # Docker's own DNS: the addresses of the lending-service copies are looked up again every 10 seconds,
      # so a restarted or redeployed copy is found at its new address
      resolver 127.0.0.11 valid=10s ipv6=off;

      upstream lending {
          zone lending 64k;
          server lending-service:8083 resolve;
      }

      log_format balanced '$$remote_addr "$$request" $$status -> $$upstream_addr in $$request_time s';

      server {
          listen 80;
          access_log /dev/stdout balanced;

          location = /lb-health {
              access_log off;
              return 200 "ok\n";
          }

          location / {
              proxy_pass http://lending;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              # a copy that does not answer within 2 s is skipped (and left out for 10 s);
              # a failed GET is then tried on the other copy, a POST such as a borrow is never sent twice
              proxy_connect_timeout 2s;
              proxy_next_upstream error timeout;
              add_header X-Lending-Instance $$upstream_addr always;
          }
      }
