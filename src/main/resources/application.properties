spring.profiles.active=demo
spring.application.name=booknest

server.root=http://localhost:9091
ngrok.url= https://encrust-laziness-estranged.ngrok-free.dev
server.port=9091
server.error.include-stacktrace=ALWAYS
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB



# Filter array definition (Rule index 0)
bucket4j.filters[0].cache-name=rate-limit-buckets
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].url=/auth/.*
bucket4j.filters[0].strategy=first

# Inner limit layer (Index 0)
bucket4j.filters[0].rate-limits[0].expression=getRemoteAddr()

# Inner bandwidth layer (Index 0)
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=interval

# Optional explicit failure JSON layout override
bucket4j.filters[0].http-response-body={ "status": 429, "error": "Too Many Requests", "message": "Slow down! Try again in a minute." }


springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**,/auth/**

# Email Template Asset URLs
app.email.gif-url=https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2VxdjhtZmJveTRlcHprbTcydTZ3YmQ0c3VyOThocHN4dGZ6N2hvZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/jfKiMjWolBzuWkdbw0/giphy.gif