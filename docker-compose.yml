# The whole of BookNest:   docker compose up --build
# Only what the services need, when they run from IntelliJ:   docker compose up -d postgres kafka frontend
# Secrets come from the .env file next to this one (copy .env.example to .env and fill it in).

services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: booknest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"   # 5433 on your PC, so it does not clash with a PostgreSQL installed there
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booknest"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for the containers (kafka:29092), EXTERNAL for apps on your PC (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: booknest/user-service:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booknest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - profile-images:/app/profile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: &service-health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT:-8081}/actuator/health > /dev/null"]
      interval: 10s
      start_period: 30s
      retries: 12

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    image: booknest/catalog-service:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booknest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LENDING_SERVICE_URL: http://lending-service:8083
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-health

  lending-service:
    build:
      context: .
      dockerfile: lending-service/Dockerfile
    image: booknest/lending-service:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booknest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *service-health

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: booknest/notification-service:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booknest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *service-health

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: booknest/api-gateway:dev
    environment:
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      LENDING_SERVICE_URL: http://lending-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      FRONTEND_URL: http://frontend:80
    ports:
      - "8080:8080"   # the only service your browser talks to
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      lending-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: booknest/frontend:dev
    ports:
      - "3000:80"     # so the gateway can also reach it when the services run from IntelliJ

volumes:
  postgres-data:
  kafka-data:
  profile-images:
