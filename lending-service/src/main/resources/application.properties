spring.profiles.active=dev,race-demo
spring.application.name=lending-service

server.port=8083
server.forward-headers-strategy=native
server.error.include-stacktrace=ALWAYS

spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

jwt-secret=${JWT_SECRET}

springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**

app.fines.late-per-day=0.35

app.holds.hours=24

app.reminders.cron=0 0 9 * * *

# Kafka: events are sent as JSON without Java type headers, so other services read them into their own classes
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# acks=all: Kafka confirms only once the event is safely stored; idempotence: a resend never writes it twice
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
